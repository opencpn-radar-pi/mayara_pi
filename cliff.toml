# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/opencpn-radar-pi/mayara_pi
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.remote.pr_number %} ([PR #{{ commit.remote.pr_number }}](https://github.com/opencpn-radar-pi/mayara_pi/pull/{{ commit.remote.pr_number }})){% endif %}\
{% endfor %}
{% endfor %}\n
"""
footer = """
{%- macro remote_url() -%}
  https://github.com/opencpn-radar-pi/mayara_pi
{%- endmacro -%}

{% for release in releases -%}
    {% if release.version and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/releases/tag/{{ release.version }}
    {% elif release.previous.version -%}
        [Unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
    {% else -%}
        [Unreleased]: {{ self::remote_url() }}/commits/main
    {% endif -%}
{% endfor %}
"""
trim = true

[remote.github]
owner = "opencpn-radar-pi"
repo = "mayara_pi"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "(?i)^chore\\(release\\)", skip = true },
    { message = "(?i)^chore\\(deps\\)", skip = true },
    { message = "(?i)^docs(\\(changelog\\))?: update CHANGELOG", skip = true },
    # Skip "address CR findings" / "address CodeRabbit findings" fixup commits.
    # Anchored to the start and requires a conventional-commit prefix, so it
    # only matches fixup-commit SUBJECTS, not squash-merge commit BODIES that
    # concatenate intermediate commit subjects (see mayara-server PR #95,
    # where an unanchored version silently dropped whole PRs).
    { message = "(?i)^[a-z]+(\\([a-z]+\\))?: address .*(CR|CodeRabbit)", skip = true },
    { message = "(?i)^feat", group = "Added" },
    { message = "(?i)^fix", group = "Fixed" },
    { message = "(?i)^refactor", group = "Changed" },
    { message = "(?i)^perf", group = "Changed" },
    { message = "(?i)^docs", group = "Changed" },
    { message = "(?i)^style", skip = true },
    { message = "(?i)^test", skip = true },
    { message = "(?i)^chore", skip = true },
    { message = "(?i)^ci", skip = true },
    # Predates the switch to conventional commits: syntactically looks like
    # "type: subject" (e.g. "CI: ...", "Settings: ...") but isn't one of the
    # types above, so it's noise, not a real category -- drop it. The prose
    # version of this history lives in CHANGELOG.manual.md.
    { message = ".*", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
