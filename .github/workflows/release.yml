name: Release

on:
  push:
    tags:
      - 'v*'

# Runs alongside build.yml's own tag-triggered jobs (which build and publish
# the plugin packages to Cloudsmith) -- this workflow only creates the GitHub
# Release and its changelog notes, not any binaries.
jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # GITHUB_TOKEN pushes don't trigger new workflow runs (GitHub's
        # anti-recursion safeguard), so the changelog PR this job opens
        # could never get real status checks and would sit unmergeable
        # forever. A real user PAT is exempt from that.
        token: ${{ secrets.RELEASE_PAT }}

    # For a beta tag (vX.Y.Z-beta.N), git-cliff's --latest picks "the latest
    # release" by tag_pattern match, which is the beta tag itself -- but
    # cliff.toml's skip_tags then discards exactly that release, leaving
    # --latest with nothing to render (verified locally: empty output).
    # Extract the existing [Unreleased] section from CHANGELOG.md instead --
    # changelog.yml keeps it current on every push to main, so at the
    # commit a beta tag points to it already holds everything queued for
    # the next real release.
    - name: Generate release notes (beta)
      if: ${{ contains(github.ref_name, '-beta.') }}
      run: |
        {
          echo "## [${{ github.ref_name }}] - beta snapshot"
          echo ""
          awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md
        } > CHANGES.md

    - name: Generate release notes
      if: ${{ !contains(github.ref_name, '-beta.') }}
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --latest --strip header --tag ${{ github.ref_name }}
      env:
        OUTPUT: CHANGES.md
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Skipped for beta tags (vX.Y.Z-beta.N, see release.sh --beta): a beta is
    # a snapshot, not a changelog milestone. git-cliff's --tag here forces a
    # "## [<tag>]" boundary regardless of cliff.toml's skip_tags (that only
    # governs tags it discovers via `git tag`, not this explicit override),
    # so running it for a beta would close out [Unreleased] early and leave
    # the following real release's diff looking empty.
    - name: Generate full changelog
      if: ${{ !contains(github.ref_name, '-beta.') }}
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --output CHANGELOG.md --tag ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Append historical changelog
      if: ${{ !contains(github.ref_name, '-beta.') }}
      run: |
        printf '\n' >> CHANGELOG.md
        cat CHANGELOG.manual.md >> CHANGELOG.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        body_path: CHANGES.md
        prerelease: ${{ contains(github.ref_name, '-beta.') }}

    - name: Commit changelog
      if: ${{ !contains(github.ref_name, '-beta.') }}
      env:
        GH_TOKEN: ${{ secrets.RELEASE_PAT }}
      run: |
        # git-cliff has already rewritten CHANGELOG.md in the working
        # tree during the previous step. Snapshot it, then force the
        # switch to main so the uncommitted modification doesn't block
        # the checkout (the snapshot is restored right after). Without
        # -f, `git switch -C` aborts with "Your local changes ... would
        # be overwritten by checkout" and the changelog PR never opens.
        cp CHANGELOG.md /tmp/CHANGELOG.md
        git fetch origin main
        git switch -fC main origin/main
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        cp /tmp/CHANGELOG.md CHANGELOG.md
        # data/ is installed alongside the binary on every platform (see
        # PluginInstall.cmake); the in-app changelog viewer reads this copy.
        cp CHANGELOG.md data/CHANGELOG.md
        git add CHANGELOG.md data/CHANGELOG.md
        if ! git diff --staged --quiet; then
          BRANCH="docs-changelog-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}"
          git switch -C "$BRANCH"
          git commit -m "docs(changelog): update CHANGELOG.md for ${{ github.ref_name }}"
          git push --set-upstream origin "$BRANCH"
          PR_URL="$(gh pr create --title "docs(changelog): update CHANGELOG.md for ${{ github.ref_name }}" --body "Auto-generated changelog update." --base main --head "$BRANCH")"
          gh pr merge "$PR_URL" --squash --delete-branch --auto || gh pr merge "$PR_URL" --squash --delete-branch
        fi
