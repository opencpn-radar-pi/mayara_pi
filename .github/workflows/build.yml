# mayara_pi CI. GitHub Actions only (the FE2 template's CircleCI/AppVeyor/
# Travis are gone). Every job runs the portable FE2 ci/ build script for its
# target on a GitHub-hosted runner, then the GitHub-Actions-aware
# cloudsmith-upload.sh, and uploads the package as a workflow artifact.
#
# Linux targets run inside a distro container (so the artifact links against
# that distro's libraries) with a small prereqs step to install git/sudo that
# the FE2 scripts assume. Windows/macOS run on their native runners.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Set these as repository secrets to enable Cloudsmith publishing. Publishing
  # is skipped for pull requests: those builds are unreviewed, and upstream's
  # "was it a collaborator?" guard reads CircleCI variables that do not exist
  # here, so it lets everything through.
  CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
  # The upload script reads PROD/BETA/ALPHA. Optional: each falls back to the
  # name cmake baked in (opencpn-radar-pi/mayara-{prod,beta,alpha}).
  CLOUDSMITH_PROD_REPO: ${{ secrets.CLOUDSMITH_PROD_REPO }}
  CLOUDSMITH_BETA_REPO: ${{ secrets.CLOUDSMITH_BETA_REPO }}
  CLOUDSMITH_ALPHA_REPO: ${{ secrets.CLOUDSMITH_ALPHA_REPO }}
  CMAKE_BUILD_PARALLEL_LEVEL: '3'

jobs:
  # --------------------------------------------------------------- macOS ----
  macos-universal:
    runs-on: macos-14
    env:
      OCPN_TARGET: macos
      WX_VER: '32'
    outputs:
      target-version: ${{ steps.vers.outputs.target-version }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Record OS version
        id: vers
        # PluginSetup.cmake bakes this same "sw_vers -productVersion" value
        # into the package name (see PKG_TARGET_VERSION there) -- GitHub
        # patches the macos-14 runner's OS over time, so it drifts (14.8.7 ->
        # 14.8.9, say) independently of this workflow. Recording the actual
        # value here, for publish-catalog to consume, keeps the catalog
        # generator from having to hardcode -- and silently fall out of sync
        # with -- a version nothing here controls.
        run: echo "target-version=$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"
      - name: Build (arm64 + x86_64 universal)
        run: bash ci/circleci-build-macos-universal.sh
      - name: Publish to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != '' && github.event_name != 'pull_request'
        run: |
          set -e
          # The FE2 script installs cloudsmith-cli only under CircleCI/Travis.
          # A venv keeps this identical everywhere: pip --user puts the scripts
          # in a different place on macOS than on Linux, and the distro
          # containers ship no pip at all.
          python3 -m venv "$HOME/cs-venv"
          "$HOME/cs-venv/bin/pip" install --quiet cloudsmith-cli
          export PATH="$HOME/cs-venv/bin:$PATH"
          cloudsmith --version
          bash ci/cloudsmith-upload.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mayara_pi-macos-universal
          path: |
            build/*.tar.gz
            build/*.pkg
          if-no-files-found: warn

  # ------------------------------------------------------------- Windows ----
  windows-msvc:
    runs-on: windows-2022
    env:
      OCPN_TARGET: MSVC
      WX_VER: '32'
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Ensure wget
        # win_deps.bat (vendored, do not edit) only calls choco for wget if
        # `wget --version` fails, in one unretried shot -- and
        # community.chocolatey.org's feed intermittently 504s. Pre-install it
        # here with retries so that check already finds a working wget and
        # never touches the flaky feed. Same pattern would apply to its other
        # choco-installed tools (cmake, poedit, python, 7zip) if any of those
        # start flaking too; none has so far.
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            if (Get-Command wget -ErrorAction SilentlyContinue) { $ok = $true; break }
            choco install -y --no-progress wget
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            $delay = 10 * $i
            Write-Host "choco install wget failed (attempt $i/5), retrying in ${delay}s..."
            Start-Sleep -Seconds $delay
          }
          if (-not $ok) { throw "could not install wget after 5 attempts" }
      - name: Build
        shell: cmd
        run: ci\circleci-build-msvc.bat
      - name: Publish to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != '' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -e
          python -m venv "$HOME/cs-venv"
          "$HOME/cs-venv/Scripts/pip" install --quiet cloudsmith-cli
          export PATH="$HOME/cs-venv/Scripts:$PATH"
          cloudsmith --version
          bash ci/cloudsmith-upload.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mayara_pi-windows-msvc
          path: |
            build/*.exe
            build/*.tar.gz
          if-no-files-found: warn

  # --------------------------------------------------------- Debian/Ubuntu --
  # One job per distro (each links against that distro's wx/libs). x86_64 runs
  # on the standard runner; arm64 uses GitHub's native arm runner.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-bookworm-x86_64, runs-on: ubuntu-latest,    container: 'debian:bookworm', script: ci/circleci-build-debian.sh, target: bookworm, env: debian }
          - { name: debian-bookworm-arm64,  runs-on: ubuntu-24.04-arm, container: 'debian:bookworm', script: ci/circleci-build-debian.sh, target: bookworm, env: debian }
          - { name: debian-trixie-x86_64,   runs-on: ubuntu-latest,    container: 'debian:trixie',   script: ci/circleci-build-debian.sh, target: trixie,   env: debian }
          - { name: debian-trixie-arm64,    runs-on: ubuntu-24.04-arm, container: 'debian:trixie',   script: ci/circleci-build-debian.sh, target: trixie,   env: debian }
          - { name: ubuntu-noble,           runs-on: ubuntu-24.04,     container: '',                script: ci/circleci-build-debian.sh, target: noble,    env: debian }
          - { name: ubuntu-noble-armhf,     runs-on: ubuntu-24.04,     container: '',                script: ci/circleci-build-debian-armhf.sh, target: noble, env: debian }
          # jammy (22.04) needs wx >= 3.2.2, which isn't in its own repos
          # (only 3.2.1) -- the opencpn PPA carries the same 3.2.2 build
          # noble ships, for amd64/arm64/armhf alike, so both jammy jobs pull
          # from it (wx_ppa: true) instead of skipping jammy as covered by
          # noble.
          - { name: ubuntu-jammy,           runs-on: ubuntu-latest,    container: 'ubuntu:22.04',   script: ci/circleci-build-debian.sh, target: jammy,    env: debian, wx_ppa: 'true' }
          - { name: ubuntu-jammy-armhf,     runs-on: ubuntu-latest,    container: 'ubuntu:22.04',   script: ci/circleci-build-debian-armhf.sh, target: jammy, env: debian, wx_ppa: 'true' }
          - { name: fedora,                 runs-on: ubuntu-latest,    container: 'fedora:41',       script: ci/circleci-build-fedora.sh, target: fedora,   env: fedora }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    env:
      OCPN_TARGET: ${{ matrix.target }}
      BUILD_ENV: ${{ matrix.env }}
      WX_VER: '32'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Container prerequisites
        if: matrix.container != ''
        shell: sh
        run: |
          # Bare-container apt-get/dnf occasionally hits transient network or
          # container-runtime flakiness (a resolv.conf race setting up the
          # container's DNS, a mirror timeout, ...); retry with backoff
          # rather than failing the whole job on a blip.
          retry() {
            n=0; max=5; delay=10
            while true; do
              "$@" && return 0
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "gave up after $n attempts: $*" >&2
                return 1
              fi
              echo "retrying ($n/$max) in ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          if command -v apt-get >/dev/null 2>&1; then
            # Bare container apt prompts interactively; make every apt-get -y.
            printf 'APT::Get::Assume-Yes "true";\n' \
              > /etc/apt/apt.conf.d/90noninteractive
            retry apt-get update
            retry apt-get install -y --no-install-recommends git sudo ca-certificates \
              python3 python3-venv python3-pip
          elif command -v dnf >/dev/null 2>&1; then
            retry dnf install -y git sudo dnf-plugins-core python3 python3-pip
          fi
          # The workspace is owned by a different UID than root in the
          # container; let git operate on it (the FE2 scripts run submodule
          # update).
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Add OpenCPN PPA (wx 3.2.2, needed on jammy)
        if: matrix.wx_ppa == 'true'
        shell: sh
        run: |
          retry() {
            n=0; max=5; delay=10
            while true; do
              "$@" && return 0
              n=$((n + 1))
              if [ "$n" -ge "$max" ]; then
                echo "gave up after $n attempts: $*" >&2
                return 1
              fi
              echo "retrying ($n/$max) in ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          retry apt-get update
          # gnupg is needed for add-apt-repository's key import; the minimal
          # ubuntu:22.04 image ships neither it nor a gpg-agent.
          retry apt-get install -y --no-install-recommends software-properties-common gnupg
          retry add-apt-repository -y ppa:opencpn/opencpn
          retry apt-get update
      - name: Build
        run: bash ${{ matrix.script }}
      - name: Publish to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != '' && github.event_name != 'pull_request'
        run: |
          set -e
          # The FE2 script installs cloudsmith-cli only under CircleCI/Travis.
          # A venv keeps this identical everywhere: pip --user puts the scripts
          # in a different place on macOS than on Linux, and the distro
          # containers ship no pip at all.
          CS_BIN="$HOME/cs-venv/bin"
          if python3 -m venv "$HOME/cs-venv"; then
            "$CS_BIN/pip" install --quiet cloudsmith-cli
          else
            # ubuntu-noble-armhf has been hitting "ensurepip is not available"
            # here despite python3-venv being present and reinstalled -- not
            # reproducible from a clean image, so fall back instead of
            # chasing it further. --break-system-packages doesn't exist on
            # older pip (e.g. jammy's), hence the plain retry.
            echo "python3 -m venv failed; falling back to pip3 --user"
            pip3 install --quiet --user --break-system-packages cloudsmith-cli \
              || pip3 install --quiet --user cloudsmith-cli
            CS_BIN="$(python3 -m site --user-base)/bin"
          fi
          export PATH="$CS_BIN:$PATH"
          cloudsmith --version
          bash ci/cloudsmith-upload.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mayara_pi-${{ matrix.name }}
          path: |
            build/*.tar.gz
            build/*.deb
            build/*.rpm
          if-no-files-found: warn

  # --------------------------------------------------------------- Flatpak --
  # Runs on the bare Ubuntu runner rather than a privileged Fedora container:
  # the FE2 script installs its prerequisites with apt, which cannot work inside
  # Fedora, and GitHub's runners already allow the user namespaces bubblewrap
  # needs. The prerequisites are installed here instead, and CI is blanked for
  # the build step so the script skips its own apt block -- that block also uses
  # apt-key, which modern Ubuntu no longer ships.
  flatpak:
    # Both arches OpenCPN itself is published for on Flathub. An x86_64-only
    # extension is no use on a Pi or an Apple-silicon VM, which is most of the
    # Linux this plugin actually runs on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: flatpak-x86_64, runs-on: ubuntu-24.04,      arch: x86_64 }
          - { name: flatpak-arm64,  runs-on: ubuntu-24.04-arm,  arch: aarch64 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    env:
      OCPN_TARGET: flatpak
      BUILD_ARCH: ${{ matrix.arch }}
      # Must match the runtime the OpenCPN flatpak is built on:
      # flathub org.opencpn.OpenCPN (master and beta) is on
      # org.freedesktop.Platform 25.08. Building the extension
      # against an older SDK links it to a base OpenCPN is not on.
      SDK_VER: '25.08'
      FLATPAK_BRANCH: beta
      # No WX_VER here on purpose. Set it, and PluginSetup.cmake puts "-32" in
      # PKG_TARGET_WX_VER, which PluginConfigure.cmake folds into the packaging
      # target the metadata publishes as <target>, giving "flatpak-32-aarch64".
      # OpenCPN compares that string exactly against its own packaging/ABI
      # target, "flatpak-aarch64" -- the form every flatpak plugin in its
      # catalog uses -- so the suffix makes the tarball refuse to import with
      # "incompatible plugin detected". Leaving it unset leaves the suffix out,
      # and the SDK provides exactly one wxWidgets, so nothing is ambiguous.
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder ca-certificates
          git config --global --add safe.directory '*'
      - name: Build
        env:
          CI: ''
        run: bash ci/circleci-build-flatpak.sh
      - name: Publish to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != '' && github.event_name != 'pull_request'
        run: |
          set -e
          # The FE2 script installs cloudsmith-cli only under CircleCI/Travis.
          # A venv keeps this identical everywhere: pip --user puts the scripts
          # in a different place on macOS than on Linux, and the distro
          # containers ship no pip at all.
          python3 -m venv "$HOME/cs-venv"
          "$HOME/cs-venv/bin/pip" install --quiet cloudsmith-cli
          export PATH="$HOME/cs-venv/bin:$PATH"
          cloudsmith --version
          bash ci/cloudsmith-upload.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mayara_pi-${{ matrix.name }}
          path: build/*.tar.gz
          if-no-files-found: warn

  # ------------------------------------------------------ Catalog publish --
  # Regenerates our own OpenCPN plugin catalog (one of alpha/beta/prod,
  # whichever this push routed to) from the per-target metadata the jobs
  # above already uploaded to Cloudsmith as "-metadata" raw packages, and
  # pushes it to opencpn-radar-pi/plugins so OpenCPN's own "Update Plugin
  # Catalog" -- pointed at CatalogChannel=custom, CatalogCustomURL=<ours> --
  # sees a new build the moment this job finishes, not whenever the separate,
  # hand-submitted metadata PR against OpenCPN/plugins happens to get
  # reviewed. always() so one failed platform (which generate-catalog.sh
  # already tolerates, skipping just that target) does not skip this too.
  publish-catalog:
    needs: [macos-universal, windows-msvc, linux, flatpak]
    # env is not readable from a job-level if (only github/needs/vars/inputs
    # are) -- the CLOUDSMITH_API_KEY check lives on the "Generate catalog"
    # step instead.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Determine channel, version and repo
        id: chan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          major=$(grep '^set(VERSION_MAJOR ' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          minor=$(grep '^set(VERSION_MINOR ' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          patch=$(grep '^set(VERSION_PATCH ' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          tweak=$(grep '^set(VERSION_TWEAK ' CMakeLists.txt | sed 's/.*"\(.*\)".*/\1/')
          pkg_version="${major}.${minor}.${patch}.${tweak}"

          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            # A tag containing "-beta." is a beta release; any other tag is
            # a real release -- mirrors cloudsmith-upload.sh.in exactly.
            # release.sh tags main's current tip directly for both cases
            # (see release.sh --release / --beta), so every tag sits "on
            # main" and a branch/ancestry check can no longer tell them
            # apart.
            case "$tag" in
              *-beta.*)
                channel=beta
                repo=opencpn-radar-pi/mayara-beta
                ;;
              *)
                channel=prod
                repo=opencpn-radar-pi/mayara-prod
                ;;
            esac
            version="$tag"
          else
            channel=alpha
            repo=opencpn-radar-pi/mayara-alpha
            short_sha=$(git rev-parse --short=7 HEAD)
            version="${pkg_version}+${RUN_NUMBER}.${short_sha}"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$pkg_version" >> "$GITHUB_OUTPUT"
      - name: Generate catalog
        if: env.CLOUDSMITH_API_KEY != ''
        env:
          CHANNEL: ${{ steps.chan.outputs.channel }}
          REPO: ${{ steps.chan.outputs.repo }}
          VERSION: ${{ steps.chan.outputs.version }}
          PKG_VERSION: ${{ steps.chan.outputs.pkg_version }}
          # From the macos-universal job itself, not hardcoded here: GitHub
          # patches the macos-14 runner's OS over time (14.8.7 -> 14.8.9, say)
          # independently of this workflow, and a hardcoded value silently
          # drifts out of sync with it -- see generate-catalog.sh's darwin
          # handling. Empty when that job didn't run/report (e.g. it failed).
          DARWIN_VERSION: ${{ needs.macos-universal.outputs.target-version }}
        run: |
          set -e
          bash scripts/generate-catalog.sh "$CHANNEL" "$REPO" "$VERSION" "$PKG_VERSION" "$CHANNEL.xml" "$DARWIN_VERSION"
      - name: Push to opencpn-radar-pi/plugins (catalog branch)
        if: env.CLOUDSMITH_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CHANNEL: ${{ steps.chan.outputs.channel }}
          VERSION: ${{ steps.chan.outputs.version }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PAT is not set; skipping catalog publish." >&2
            exit 0
          fi
          src="$PWD/$CHANNEL.xml"
          rm -rf /tmp/plugins-catalog && mkdir /tmp/plugins-catalog
          cd /tmp/plugins-catalog
          git init --quiet
          git config user.name "mayara_pi CI"
          git config user.email "actions@github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/opencpn-radar-pi/plugins.git"
          if git ls-remote --exit-code --heads origin catalog > /dev/null 2>&1; then
            git fetch --quiet --depth 1 origin catalog
            git checkout --quiet -b catalog origin/catalog
          else
            git checkout --quiet -b catalog
          fi
          cp "$src" "./$CHANNEL.xml"
          git add "$CHANNEL.xml"
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
          else
            git commit --quiet -m "Update $CHANNEL catalog to $VERSION"
            git push --quiet origin catalog
          fi

  # --------------------------------------------------------------- Android --
  # Disabled: the FE2 android scripts provision the SDK/NDK the CircleCI way
  # and have not been ported, so these only ever fail. The jobs are kept (rather
  # than deleted) so re-enabling is a one-line change once that work is done.
  android:
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android-arm64, script: ci/circleci-build-android-arm64.sh }
          - { name: android-armhf, script: ci/circleci-build-android-armhf.sh }
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Build
        run: bash ${{ matrix.script }}
      - name: Publish to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != '' && github.event_name != 'pull_request'
        run: |
          set -e
          # The FE2 script installs cloudsmith-cli only under CircleCI/Travis.
          # A venv keeps this identical everywhere: pip --user puts the scripts
          # in a different place on macOS than on Linux, and the distro
          # containers ship no pip at all.
          python3 -m venv "$HOME/cs-venv"
          "$HOME/cs-venv/bin/pip" install --quiet cloudsmith-cli
          export PATH="$HOME/cs-venv/bin:$PATH"
          cloudsmith --version
          bash ci/cloudsmith-upload.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mayara_pi-${{ matrix.name }}
          path: build/*.tar.gz
          if-no-files-found: warn
